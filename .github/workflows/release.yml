name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Enforce strict release tag shape
        shell: bash
        run: |
          # Release tags are vMAJOR.MINOR.PATCH with an optional pre-release; build metadata is rejected.
          case "$GITHUB_REF_NAME" in
            *+*) echo "Release tag $GITHUB_REF_NAME must not contain build metadata (+)." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run scripts/check-release.ts "$GITHUB_REF_NAME"
      - name: Validate annotated tag and main ancestry
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          if [ "$(jq -r '.object.type' <<<"$ref")" != 'tag' ]; then
            echo 'Release tags must be annotated or signed, not lightweight.' >&2
            exit 1
          fi
          tag_object="$(jq -r '.object.sha' <<<"$ref")"
          tag_data="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          if [ "$(jq -r '.object.type' <<<"$tag_data")" != 'commit' ]; then
            echo 'Release tag must point directly to a commit.' >&2
            exit 1
          fi
          release_sha="$(jq -r '.object.sha' <<<"$tag_data")"
          if [ "$release_sha" != "$(git rev-parse HEAD)" ]; then
            echo 'Checked-out commit does not match the remote release tag.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo 'Release tag must point to a commit contained in origin/main.' >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Require successful CI workflow for release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$RELEASE_SHA&per_page=20")"
          run_id="$(jq -r --arg sha "$RELEASE_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .conclusion == "success")] | first | .id // empty' <<<"$runs")"
          if [ -z "$run_id" ]; then
            echo "No successful CI workflow run exists for $RELEASE_SHA on main." >&2
            exit 1
          fi
          jobs="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
          for name in 'Check (ubuntu-latest)' 'Check (windows-latest)' 'Check (macos-latest)'; do
            count="$(jq --arg name "$name" '[.jobs[] | select(.name == $name and .conclusion == "success")] | length' <<<"$jobs")"
            if [ "$count" -ne 1 ]; then
              echo "Required CI job is not uniquely successful in run $run_id: $name" >&2
              exit 1
            fi
          done
      - run: git show --check --format=fuller "${{ steps.release.outputs.release_sha }}"
      - run: bun run check
      - run: bun run src/cli.ts --help
      - run: bun run build -- --all
      - run: bun run smoke:build
      - run: bun run verify:checksums -- --all
      - name: Upload verified release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/SHA256SUMS
            dist/agent-connect-${{ github.ref_name }}-windows-x64.exe
            dist/agent-connect-${{ github.ref_name }}-linux-x64
            dist/agent-connect-${{ github.ref_name }}-linux-arm64
            dist/agent-connect-${{ github.ref_name }}-darwin-x64
            dist/agent-connect-${{ github.ref_name }}-darwin-arm64

  smoke-release:
    name: Smoke release (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: agent-connect-${{ github.ref_name }}-linux-x64
            shell: bash
          - os: ubuntu-24.04-arm
            asset: agent-connect-${{ github.ref_name }}-linux-arm64
            shell: bash
          - os: windows-latest
            asset: agent-connect-${{ github.ref_name }}-windows-x64.exe
            shell: pwsh
          - os: macos-15-intel
            asset: agent-connect-${{ github.ref_name }}-darwin-x64
            shell: bash
          - os: macos-latest
            asset: agent-connect-${{ github.ref_name }}-darwin-arm64
            shell: bash
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - name: Smoke-test Unix release binary
        if: matrix.shell == 'bash'
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          binary="dist/$ASSET"
          case "$ASSET" in
            *-arm64) case "$(uname -m)" in arm64|aarch64) ;; *) echo 'Expected an arm64 runner.' >&2; exit 1 ;; esac ;;
            *-x64) [ "$(uname -m)" = 'x86_64' ] || { echo 'Expected an x64 runner.' >&2; exit 1; } ;;
          esac
          awk -v asset="$ASSET" '
            NF == 2 {
              name = $2
              sub(/^\*/, "", name)
              if (name == asset) { print; found = 1 }
            }
            END { exit found ? 0 : 1 }
          ' dist/SHA256SUMS > "$RUNNER_TEMP/asset.sum" || { echo "SHA256SUMS does not contain $ASSET." >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c "$RUNNER_TEMP/asset.sum")
          else
            (cd dist && shasum -a 256 -c "$RUNNER_TEMP/asset.sum")
          fi
          chmod 755 "$binary"
          test "$("$binary" --version)" = "${GITHUB_REF_NAME#v}"
          "$binary" --help | grep -F 'agent-connect' >/dev/null
      - name: Smoke-test Windows release binary
        if: matrix.shell == 'pwsh'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          $binary = Resolve-Path "dist/$env:ASSET"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Expected an x64 Windows runner.' }
          $line = Get-Content -LiteralPath 'dist/SHA256SUMS' | Where-Object { $_ -match "^[A-Fa-f0-9]{64}\s+\*?$([regex]::Escape($env:ASSET))$" } | Select-Object -First 1
          if (-not $line) { throw "SHA256SUMS does not contain $env:ASSET." }
          $expectedHash = ($line -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "Checksum mismatch for $env:ASSET." }
          $expected = $env:GITHUB_REF_NAME.Substring(1)
          $actual = (& $binary --version | Out-String).Trim()
          if ($actual -ne $expected) { throw "Expected $expected, received $actual" }
          $help = (& $binary --help | Out-String)
          if (-not $help.Contains('agent-connect')) { throw 'Release help output is incomplete.' }

  publish:
    name: Attest and publish release
    needs: [build, smoke-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - name: Reverify downloaded release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            SHA256SUMS
            "agent-connect-v$version-windows-x64.exe"
            "agent-connect-v$version-linux-x64"
            "agent-connect-v$version-linux-arm64"
            "agent-connect-v$version-darwin-x64"
            "agent-connect-v$version-darwin-arm64"
          )
          if ! diff -u \
            <(printf '%s\n' "${expected[@]}" | sort) \
            <(find dist -maxdepth 1 -type f -printf '%f\n' | sort); then
            echo 'Downloaded release file inventory is not exact.' >&2
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Verify remote tag still targets the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          if [ "$(jq -r '.object.type' <<<"$ref")" != 'tag' ]; then
            echo 'Remote release tag is no longer annotated or signed.' >&2
            exit 1
          fi
          tag_object="$(jq -r '.object.sha' <<<"$ref")"
          tag_data="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
          if [ "$(jq -r '.object.type' <<<"$tag_data")" != 'commit' ] || \
             [ "$(jq -r '.object.sha' <<<"$tag_data")" != "$RELEASE_SHA" ]; then
            echo 'Remote release tag no longer targets the built commit.' >&2
            exit 1
          fi
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/agent-connect-${{ github.ref_name }}-windows-x64.exe
            dist/agent-connect-${{ github.ref_name }}-linux-x64
            dist/agent-connect-${{ github.ref_name }}-linux-arm64
            dist/agent-connect-${{ github.ref_name }}-darwin-x64
            dist/agent-connect-${{ github.ref_name }}-darwin-arm64
      - name: Publish complete GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          asset_paths=(
            dist/SHA256SUMS
            "dist/agent-connect-v$version-windows-x64.exe"
            "dist/agent-connect-v$version-linux-x64"
            "dist/agent-connect-v$version-linux-arm64"
            "dist/agent-connect-v$version-darwin-x64"
            "dist/agent-connect-v$version-darwin-arm64"
          )
          asset_names=(
            SHA256SUMS
            "agent-connect-v$version-windows-x64.exe"
            "agent-connect-v$version-linux-x64"
            "agent-connect-v$version-linux-arm64"
            "agent-connect-v$version-darwin-x64"
            "agent-connect-v$version-darwin-arm64"
          )

          verify_remote_tag() {
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
            if [ "$(jq -r '.object.type' <<<"$ref")" != 'tag' ]; then
              echo 'Remote release tag is no longer annotated or signed.' >&2
              return 1
            fi
            tag_object="$(jq -r '.object.sha' <<<"$ref")"
            tag_data="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
            if [ "$(jq -r '.object.type' <<<"$tag_data")" != 'commit' ] || \
               [ "$(jq -r '.object.sha' <<<"$tag_data")" != "$RELEASE_SHA" ]; then
              echo 'Remote release tag no longer targets the built commit.' >&2
              return 1
            fi
          }

          verify_remote_release() {
            if ! diff -u \
              <(printf '%s\n' "${asset_names[@]}" | sort) \
              <(gh release view "$tag" --json assets --jq '.assets[].name' | sort); then
              echo 'Remote release asset inventory is not exact.' >&2
              return 1
            fi
            download_dir="$(mktemp -d)"
            gh release download "$tag" --dir "$download_dir"
            (cd "$download_dir" && sha256sum -c SHA256SUMS)
            cmp dist/SHA256SUMS "$download_dir/SHA256SUMS"
            for local_asset in "${asset_paths[@]}"; do
              asset_name="$(basename "$local_asset")"
              cmp "$local_asset" "$download_dir/$asset_name"
            done
            rm -rf "$download_dir"
          }

          verify_remote_tag
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != 'true' ]; then
              remote_prerelease="$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')"
              if [ "$remote_prerelease" != "$PRERELEASE" ]; then
                echo "Published release prerelease state differs: expected $PRERELEASE, found $remote_prerelease" >&2
                exit 1
              fi
              verify_remote_release
              echo "Release $tag is already published with identical verified assets."
              exit 0
            fi
            gh release delete "$tag" --yes
          fi

          create_args=("$tag" --draft --generate-notes --title "Agent Connect $tag")
          if [ "$PRERELEASE" = 'true' ]; then create_args+=(--prerelease); fi
          gh release create "${create_args[@]}"

          gh release upload "$tag" "${asset_paths[@]}"
          verify_remote_release
          verify_remote_tag
          gh release edit "$tag" --prerelease="$PRERELEASE" --draft=false
