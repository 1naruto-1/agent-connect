name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check pull-request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
      - name: Check pushed commits for whitespace
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git diff --check "${{ github.event.before }}..${{ github.sha }}"
      - name: Check initial pushed history for whitespace
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          empty_tree="$(git mktree </dev/null)"
          git diff --check "$empty_tree" "${{ github.sha }}"
      - run: bun run check
      - run: bun run src/cli.ts --help
      - run: bun run build
      - run: bun run smoke:build
      - run: bun run verify:checksums
