name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check pull-request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
      - name: Check pushed commits for whitespace
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A force-push can make github.event.before unreachable; fall back instead of failing.
          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA..$GITHUB_SHA"
          elif git rev-parse --verify --quiet "$GITHUB_SHA~1" >/dev/null; then
            echo "Base commit $BEFORE_SHA is unreachable; checking against the parent commit instead."
            git diff --check "$GITHUB_SHA~1..$GITHUB_SHA"
          else
            echo "Base commit $BEFORE_SHA is unreachable and $GITHUB_SHA has no parent; skipping whitespace check."
          fi
      - name: Check initial pushed history for whitespace
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          empty_tree="$(git mktree </dev/null)"
          git diff --check "$empty_tree" "${{ github.sha }}"
      - run: bun run check
      - run: bun run src/cli.ts --help
      - run: bun run build
      - run: bun run smoke:build
      - run: bun run verify:checksums
      - name: Cross-compile all release targets
        if: matrix.os == 'ubuntu-latest'
        run: bun run build -- --all
      - name: Verify checksums for all release targets
        if: matrix.os == 'ubuntu-latest'
        run: bun run verify:checksums -- --all
